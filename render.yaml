services:
  - type: web
    name: kanshan-knowledge-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ZHIHU_ACCESS_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: MODEL_NAME
        value: deepseek-v4-pro
      - key: FRONTEND_ORIGINS
        value: https://kanshan-knowledge-agent-web.onrender.com

  - type: web
    name: kanshan-knowledge-agent-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node node_modules/next/dist/bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://kanshan-knowledge-agent-api.onrender.com
